name: Build & deploy

# Runs on every push to main, every 6 hours (to pick up new itch.io games,
# repos and the contribution calendar), and on demand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (07:17, 13:17, 19:17, 01:17 Türkiye time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (refreshes GitHub, itch.io and certificate data)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to gh-pages
        run: |
          git config --global user.name "gok24code"
          git config --global user.email "229023019+gok24code@users.noreply.github.com"
          npx gh-pages -d dist -m "Deploy ${GITHUB_SHA::7}" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
